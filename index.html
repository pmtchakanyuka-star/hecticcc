<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hecticcc Weekend My Bru</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #FAFAF8;
  --bg2:       #F4F2EE;
  --bg3:       #EDE9E3;
  --surface:   #FFFFFF;
  --border:    rgba(60,45,30,0.10);
  --border2:   rgba(60,45,30,0.18);
  --border3:   rgba(60,45,30,0.28);
  --ink:       #1C160F;
  --ink2:      #5C4F3A;
  --ink3:      #9C8C70;
  --red:       #B84A2F;
  --red-light: #F9EDE9;
  --red-mid:   rgba(184,74,47,0.12);
  --gold:      #C49A10;
  --gold-light:#FBF5E2;
  --gold-mid:  rgba(196,154,16,0.13);
  --green:     #3A6B4A;
  --green-light:#EAF2EC;
  --green-mid: rgba(58,107,74,0.12);
  --fixed-col: #5A6B3A;
  --fixed-light:#EFF2E8;
  --radius:    14px;
  --radius-sm: 10px;
  --radius-xs: 7px;
  --shadow:    0 1px 3px rgba(60,45,30,0.07), 0 4px 16px rgba(60,45,30,0.05);
  --shadow-sm: 0 1px 2px rgba(60,45,30,0.06);
  --fh: 'Playfair Display', Georgia, serif;
  --fm: 'IBM Plex Mono', 'Courier New', monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--fm);font-size:13px;line-height:1.6;overscroll-behavior:none;}
::selection{background:var(--gold-mid);color:var(--ink);}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* ── GRAIN OVERLAY ── */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.4;}

/* ── HEADER ── */
.header{position:sticky;top:0;z-index:100;background:rgba(250,250,248,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 20px;}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:56px;}
.logo{display:flex;align-items:baseline;gap:6px;}
.logo-word{font-family:var(--fh);font-size:22px;font-weight:900;font-style:italic;letter-spacing:-0.5px;line-height:1;}
.logo-r{color:var(--red);}
.logo-g{color:var(--green);}
.logo-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);margin-bottom:2px;flex-shrink:0;}
.header-trip{font-size:11px;color:var(--ink3);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:0.02em;}
.header-trip-btn{display:flex;align-items:center;gap:5px;background:none;border:none;cursor:pointer;font-family:var(--fm);font-size:11px;color:var(--ink3);max-width:160px;padding:4px 8px;border-radius:var(--radius-xs);transition:background 0.15s;}
.header-trip-btn:active{background:var(--bg2);}
.header-trip-btn .trip-name-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.header-trip-btn .trip-caret{flex-shrink:0;font-size:9px;}
.back-btn{display:flex;align-items:center;gap:5px;background:none;border:none;cursor:pointer;font-family:var(--fm);font-size:11px;color:var(--ink3);padding:4px 8px;border-radius:var(--radius-xs);}
.back-btn:active{background:var(--bg2);}

/* TRIP HOME SCREEN */
.home-screen{padding:20px;}
.home-section-label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px;margin-top:20px;}
.home-section-label:first-child{margin-top:0;}
.trip-list-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;cursor:pointer;margin-bottom:10px;box-shadow:var(--shadow-sm);transition:box-shadow 0.15s,border-color 0.15s;display:flex;align-items:flex-start;gap:14px;}
.trip-list-card:active{box-shadow:none;border-color:var(--border2);}
.trip-list-card.past{opacity:0.65;}
.trip-list-left{flex:1;min-width:0;}
.trip-list-name{font-family:var(--fh);font-size:17px;font-weight:700;color:var(--ink);margin-bottom:3px;line-height:1.2;}
.trip-list-dates{font-size:11px;color:var(--ink3);margin-bottom:10px;}
.trip-list-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.trip-member-stack{display:flex;}
.trip-member-av{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);margin-left:-6px;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:9px;font-weight:700;font-style:italic;}
.trip-member-av:first-child{margin-left:0;}
.trip-open-badge{font-size:10px;color:var(--gold);background:var(--gold-l);border:1px solid rgba(196,154,16,0.3);padding:2px 8px;border-radius:20px;}
.trip-decided-badge{font-size:10px;color:var(--green);background:var(--green-l);border:1px solid rgba(58,107,74,0.3);padding:2px 8px;border-radius:20px;}
.trip-list-arrow{font-size:16px;color:var(--ink3);flex-shrink:0;margin-top:2px;}
.home-new-btn{width:100%;min-height:48px;border-radius:var(--radius);border:1.5px dashed var(--border2);background:none;color:var(--ink2);font-family:var(--fh);font-size:15px;font-weight:600;font-style:italic;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;}
.home-new-btn:active{background:var(--bg2);}
.empty-home{text-align:center;padding:48px 20px;}
.empty-home-icon{font-size:36px;margin-bottom:12px;}
.empty-home-title{font-family:var(--fh);font-size:20px;font-weight:700;font-style:italic;color:var(--ink);margin-bottom:8px;}
.empty-home-sub{font-size:12px;color:var(--ink3);line-height:1.7;margin-bottom:20px;}

/* TRIP SWITCHER DROPDOWN */
.switcher-overlay{display:none;position:fixed;inset:0;z-index:200;}
.switcher-overlay.open{display:block;}
.switcher-dropdown{position:fixed;top:56px;right:0;left:0;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 8px 24px rgba(60,45,30,0.12);z-index:201;max-height:60vh;overflow-y:auto;}
.switcher-inner{padding:12px 16px;}
.switcher-label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;}
.switcher-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:background 0.1s;}
.switcher-item:active,.switcher-item:hover{background:var(--bg2);}
.switcher-item.active-trip{background:var(--green-l);}
.switcher-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.switcher-dot.upcoming{background:var(--green);}
.switcher-dot.past{background:var(--ink3);}
.switcher-item-name{font-family:var(--fh);font-size:14px;font-weight:600;color:var(--ink);flex:1;}
.switcher-item-dates{font-size:10px;color:var(--ink3);}
.switcher-divider{height:1px;background:var(--border);margin:8px 0;}
.switcher-new{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;color:var(--green);font-size:13px;font-family:var(--fh);font-weight:600;font-style:italic;}
.switcher-new:active{background:var(--green-l);}

/* ── IDENTITY ── */
.id-zone{background:var(--bg2);border-bottom:1px solid var(--border);}
.who-picker{padding:20px;}
.who-title{font-family:var(--fh);font-size:20px;font-weight:700;margin-bottom:3px;color:var(--ink);}
.who-sub{font-size:11px;color:var(--ink3);margin-bottom:16px;letter-spacing:0.02em;}
.member-grid{display:flex;flex-wrap:wrap;gap:8px;}
.member-btn{display:flex;align-items:center;gap:9px;padding:10px 15px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface);cursor:pointer;font-family:var(--fm);font-size:12px;color:var(--ink);min-height:44px;box-shadow:var(--shadow-sm);transition:border-color 0.15s,box-shadow 0.15s;}
.member-btn:active{box-shadow:none;border-color:var(--border3);}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--fh);font-size:12px;font-weight:700;font-style:italic;}
.avatar.red{background:var(--red-light);color:var(--red);}
.avatar.gold{background:var(--gold-light);color:var(--gold);}
.avatar.green{background:var(--green-light);color:var(--green);}
.avatar.fixed{background:var(--fixed-light);color:var(--fixed-col);}
.avatar-colors=['red','gold','green','fixed'];
.id-bar{padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.id-bar-left{display:flex;align-items:center;gap:10px;}
.id-name{font-family:var(--fh);font-size:15px;font-weight:600;font-style:italic;color:var(--ink);}
.id-role{font-size:10px;color:var(--ink3);letter-spacing:0.04em;}
.btn-switch{background:none;border:1px solid var(--border2);color:var(--ink2);font-family:var(--fm);font-size:10px;padding:5px 12px;border-radius:30px;cursor:pointer;letter-spacing:0.03em;}
.btn-switch:active{background:var(--bg2);}

/* ── TABS ── */
.tabs{display:flex;padding:0 20px;border-bottom:1px solid var(--border);background:var(--surface);}
.tab{padding:14px 4px;margin-right:24px;font-family:var(--fm);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;border:none;background:none;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color 0.15s,border-color 0.15s;}
.tab.active-r{color:var(--red);border-bottom-color:var(--red);}
.tab.active-g{color:var(--green);border-bottom-color:var(--green);}

/* ── MAIN ── */
.main{padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1;}

/* ── TRIP CARD ── */
.trip-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:18px 20px;box-shadow:var(--shadow);}
.trip-eyebrow{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px;}
.trip-name{font-family:var(--fh);font-size:26px;font-weight:900;line-height:1.15;letter-spacing:-0.5px;color:var(--ink);margin-bottom:4px;}
.trip-dates{font-size:11px;color:var(--ink3);margin-bottom:14px;}
.member-row{display:flex;flex-wrap:wrap;gap:6px;}
.m-chip{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 5px;border-radius:30px;font-size:11px;background:var(--bg2);border:1px solid var(--border);}
.m-chip .av-sm{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:8px;font-weight:700;font-style:italic;}
.m-chip.you{background:var(--green-light);border-color:rgba(58,107,74,0.25);color:var(--green);}
.m-chip.you .av-sm{background:var(--green);color:#fff;}

/* ── SECTION ── */
.sec-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.sec-label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);}
.btn-add{display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:30px;border:1px solid var(--border2);background:var(--surface);color:var(--ink);font-family:var(--fm);font-size:11px;cursor:pointer;box-shadow:var(--shadow-sm);}
.btn-add:active{box-shadow:none;}
.btn-group{display:flex;gap:6px;}

/* ── SLOT CARD ── */
.slot-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow);}
.slot-card.fixed-type{border-left:3px solid var(--fixed-col);}
.slot-head{padding:16px 18px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;}
.slot-head:active{background:var(--bg);}
.slot-color-bar{width:3px;border-radius:2px;align-self:stretch;flex-shrink:0;margin-top:2px;}
.slot-color-bar.deciding{background:var(--gold);}
.slot-color-bar.voted{background:var(--green);}
.slot-color-bar.decided{background:var(--green);}
.slot-color-bar.fixed{background:var(--fixed-col);}
.slot-main{flex:1;min-width:0;}
.slot-eyebrow{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px;}
.slot-title{font-family:var(--fh);font-size:17px;font-weight:700;color:var(--ink);line-height:1.3;margin-bottom:4px;}
.slot-meta{font-size:11px;color:var(--ink3);}
.slot-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.badge{padding:3px 9px;border-radius:30px;font-size:10px;font-family:var(--fm);letter-spacing:0.03em;border:1px solid;}
.badge.deciding{border-color:rgba(196,154,16,0.4);color:var(--gold);background:var(--gold-light);}
.badge.voted{border-color:rgba(58,107,74,0.3);color:var(--green);background:var(--green-light);}
.badge.decided{border-color:rgba(58,107,74,0.3);color:var(--green);background:var(--green-light);}
.badge.fixed{border-color:rgba(90,107,58,0.3);color:var(--fixed-col);background:var(--fixed-light);}
.chevron{font-size:10px;color:var(--ink3);transition:transform 0.25s;line-height:1;}
.chevron.open{transform:rotate(180deg);}
.slot-body{border-top:1px solid var(--border);display:none;}
.slot-body.open{display:block;}

/* ── FIXED SUMMARY ── */
.fixed-summary{padding:16px 18px;display:flex;gap:14px;}
.fixed-thumb{width:60px;height:60px;border-radius:var(--radius-sm);overflow:hidden;flex-shrink:0;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink3);}
.fixed-thumb img{width:100%;height:100%;object-fit:cover;}
.fixed-info{flex:1;min-width:0;}
.fixed-opt-name{font-family:var(--fh);font-size:15px;font-weight:700;margin-bottom:2px;color:var(--ink);}
.fixed-opt-meta{font-size:11px;color:var(--ink3);margin-bottom:8px;}
.link-row{display:flex;gap:6px;flex-wrap:wrap;}
.pill-link{font-size:11px;color:var(--green);border:1px solid rgba(58,107,74,0.3);padding:4px 11px;border-radius:30px;text-decoration:none;background:var(--green-light);}
.pill-link:active{opacity:0.7;}
.pill-link.red-link{color:var(--red);border-color:rgba(184,74,47,0.3);background:var(--red-light);}

/* ── OPTION CARDS ── */
.options-wrap{padding:14px 18px;display:flex;flex-direction:column;gap:10px;}
.opt-card{border-radius:var(--radius-sm);border:1px solid var(--border);overflow:hidden;background:var(--bg);}
.opt-card.winner-card{border-color:rgba(58,107,74,0.4);border-width:1.5px;}
.opt-img{width:100%;height:130px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;}
.opt-img img{width:100%;height:100%;object-fit:cover;}
.opt-body{padding:13px 14px;}
.opt-name{font-family:var(--fh);font-size:15px;font-weight:700;color:var(--ink);margin-bottom:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.chosen-tag{font-size:10px;padding:2px 8px;border-radius:30px;background:var(--green-light);color:var(--green);border:1px solid rgba(58,107,74,0.3);}
.opt-byline{font-size:11px;color:var(--ink3);margin-bottom:5px;}
.opt-price{font-size:12px;color:var(--gold);font-weight:500;margin-bottom:8px;}
.opt-notes{font-size:11px;color:var(--ink2);line-height:1.6;margin-top:4px;}
.opt-cta-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.opt-edit-row{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.btn-micro{padding:5px 11px;border-radius:30px;border:1px solid var(--border2);background:none;color:var(--ink2);font-family:var(--fm);font-size:10px;cursor:pointer;letter-spacing:0.02em;}
.btn-micro.danger{border-color:rgba(184,74,47,0.3);color:var(--red);}
.btn-micro:active{background:var(--bg2);}

/* ── VOTING ── */
.vote-block{margin-top:12px;border-top:1px solid var(--border);padding-top:12px;}
.vote-section-label{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px;}
.crit-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.crit-label{font-size:11px;color:var(--ink2);width:68px;flex-shrink:0;text-transform:capitalize;}
.stars{display:flex;gap:1px;}
.star{font-size:22px;cursor:pointer;color:var(--bg3);line-height:1;padding:2px 4px;min-width:30px;text-align:center;transition:color 0.1s;}
.star.lit{color:var(--gold);}

/* ── SLOT FOOTER ── */
.slot-foot{padding:0 18px 16px;display:flex;flex-direction:column;gap:8px;}
.btn-main{width:100%;min-height:48px;border-radius:var(--radius-sm);border:none;font-family:var(--fh);font-size:15px;font-weight:700;font-style:italic;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-0.2px;transition:opacity 0.15s;}
.btn-main:active{opacity:0.8;}
.btn-main:disabled{opacity:0.35;cursor:not-allowed;}
.btn-main.green-btn{background:var(--green);color:#fff;}
.btn-main.red-btn{background:var(--red);color:#fff;}
.btn-main.gold-btn{background:var(--gold);color:#fff;}
.btn-outline{width:100%;min-height:44px;border-radius:var(--radius-sm);background:none;color:var(--ink);border:1px solid var(--border2);font-family:var(--fm);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-outline:active{background:var(--bg2);}
.btn-outline.danger{border-color:rgba(184,74,47,0.25);color:var(--red);}
.voted-ok{background:var(--green-light);border:1px solid rgba(58,107,74,0.25);border-radius:var(--radius-sm);padding:11px 14px;font-size:12px;color:var(--green);text-align:center;font-family:var(--fm);}
.vote-hint{font-size:11px;color:var(--ink3);text-align:center;padding:4px 0;line-height:1.5;}
.confirm-banner{background:var(--green-light);border:1px solid rgba(58,107,74,0.25);border-radius:var(--radius-sm);padding:13px 16px;}
.confirm-banner-name{font-family:var(--fh);font-size:15px;font-weight:700;color:var(--green);margin-bottom:2px;}
.confirm-banner-sub{font-size:11px;color:var(--ink3);}

/* ── RESULTS ── */
.results-wrap{margin:0 18px 16px;padding:14px;background:var(--bg2);border-radius:var(--radius-sm);border:1px solid var(--border);}
.results-eyebrow{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:12px;}
.result-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.result-name{font-size:11px;width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;color:var(--ink2);}
.result-track{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;}
.result-fill{height:100%;border-radius:3px;transition:width 0.6s cubic-bezier(.34,1.56,.64,1);}
.result-fill.top{background:var(--green);}
.result-fill.rest{background:var(--gold);}
.result-score{font-size:10px;color:var(--ink3);width:26px;text-align:right;flex-shrink:0;}
.result-crown{font-size:11px;}
.waiting-txt{font-size:12px;color:var(--ink2);line-height:1.6;}
.prog-row{display:flex;align-items:center;gap:10px;margin-top:10px;}
.prog-track{flex:1;height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:var(--green);border-radius:2px;transition:width 0.4s ease;}
.prog-label{font-size:10px;color:var(--ink3);white-space:nowrap;}
.voters-txt{font-size:10px;color:var(--ink3);margin-top:6px;}

/* ── INFO BUBBLE ── */
.ib{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--border2);color:var(--ink3);font-size:9px;cursor:default;position:relative;vertical-align:middle;margin-left:3px;flex-shrink:0;}
.ib-tip{display:none;position:absolute;left:18px;top:-4px;background:var(--ink);color:var(--bg);font-size:11px;border-radius:var(--radius-xs);padding:7px 10px;width:200px;z-index:200;line-height:1.5;font-weight:400;}
.ib:hover .ib-tip,.ib:focus .ib-tip{display:block;}

/* ── ITINERARY TIMELINE ── */
.timeline{display:flex;flex-direction:column;gap:4px;}
.day-group{margin-bottom:24px;}
.day-header{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;}
.day-name{font-family:var(--fh);font-size:24px;font-weight:900;font-style:italic;color:var(--ink);line-height:1;}
.day-date-label{font-size:11px;color:var(--ink3);margin-bottom:3px;}
.day-rule{flex:1;height:1px;background:var(--border);margin-bottom:6px;}
.tl-items{display:flex;flex-direction:column;gap:0;}
.tl-row{display:flex;gap:14px;position:relative;}
.tl-spine{display:flex;flex-direction:column;align-items:center;padding-top:18px;width:16px;flex-shrink:0;}
.tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:2px solid var(--surface);}
.tl-dot.vote-dot{background:var(--green);box-shadow:0 0 0 2px rgba(58,107,74,0.2);}
.tl-dot.fixed-dot{background:var(--fixed-col);box-shadow:0 0 0 2px rgba(90,107,58,0.2);}
.tl-dot.gold-dot{background:var(--gold);box-shadow:0 0 0 2px rgba(196,154,16,0.2);}
.tl-connector{width:1px;flex:1;background:var(--border);margin-top:4px;}
.tl-card{flex:1;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:10px;cursor:pointer;transition:box-shadow 0.15s;}
.tl-card:active{box-shadow:none;}
.tl-card.fixed-card{border-left:3px solid var(--fixed-col);}
.tl-card-head{padding:14px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.tl-slot-label{font-size:10px;letter-spacing:0.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px;}
.tl-opt-name{font-family:var(--fh);font-size:17px;font-weight:700;color:var(--ink);line-height:1.2;}
.tl-meta{font-size:11px;color:var(--ink3);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;}
.tl-thumb{width:50px;height:50px;border-radius:var(--radius-xs);overflow:hidden;flex-shrink:0;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:20px;}
.tl-thumb img{width:100%;height:100%;object-fit:cover;}
.tl-expand{border-top:1px solid var(--border);padding:12px 16px;display:none;}
.tl-expand.open{display:block;}
.tl-notes{font-size:12px;color:var(--ink2);line-height:1.6;margin-bottom:10px;}
.tl-links{display:flex;gap:6px;flex-wrap:wrap;}
.share-strip{width:100%;min-height:50px;border-radius:var(--radius);background:none;border:1px solid var(--border2);color:var(--ink);font-family:var(--fh);font-size:15px;font-weight:600;font-style:italic;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;}
.share-strip:active{background:var(--bg2);}
.empty-itin{text-align:center;padding:48px 20px;color:var(--ink3);}
.empty-itin-icon{font-size:36px;margin-bottom:12px;}
.empty-itin-title{font-family:var(--fh);font-size:20px;font-weight:700;font-style:italic;color:var(--ink);margin-bottom:6px;}
.empty-itin-sub{font-size:12px;line-height:1.7;}

/* ── MODALS ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(28,22,15,0.5);z-index:300;align-items:flex-end;backdrop-filter:blur(4px);}
.modal-overlay.open{display:flex;}
.modal-sheet{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-height:92vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom);}
.modal-pull{padding:12px 0 0;display:flex;justify-content:center;}
.modal-pull-bar{width:40px;height:4px;background:var(--border2);border-radius:2px;}
.modal-body{padding:20px 20px 36px;}
.modal-title{font-family:var(--fh);font-size:22px;font-weight:900;font-style:italic;margin-bottom:18px;color:var(--ink);letter-spacing:-0.3px;}
.modal-footer{display:flex;gap:8px;margin-top:18px;}
.modal-footer .btn-outline{flex:1;width:auto;}
.modal-footer .btn-main{flex:2;width:auto;min-height:46px;}

/* ── FORMS ── */
.fg{margin-bottom:14px;}
.fg label{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center;margin-bottom:5px;}
.fg input,.fg textarea,.fg select{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--ink);font-family:var(--fm);font-size:13px;padding:10px 13px;border-radius:var(--radius-sm);outline:none;transition:border-color 0.15s;}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--green);background:var(--surface);}
.fg textarea{min-height:68px;resize:vertical;}
.fg .form-hint{font-size:10px;color:var(--ink3);margin-top:4px;line-height:1.5;}
.fg-2{display:flex;gap:10px;}
.fg-2 .fg{flex:1;}
.fetch-row{display:flex;gap:8px;}
.fetch-row input{flex:1;}
.btn-fetch{padding:0 14px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg);color:var(--ink);font-family:var(--fm);font-size:11px;cursor:pointer;min-height:42px;white-space:nowrap;}
.btn-fetch:active{background:var(--bg2);}
.fetch-status{font-size:10px;color:var(--ink3);margin-top:4px;min-height:14px;}
.field-err{font-size:11px;color:var(--red);margin-top:3px;}

/* ── TYPE TOGGLE ── */
.type-toggle{display:flex;border:1px solid var(--border2);border-radius:var(--radius-sm);overflow:hidden;}
.type-btn{flex:1;padding:10px 8px;border:none;background:none;color:var(--ink3);font-family:var(--fm);font-size:11px;cursor:pointer;transition:background 0.15s,color 0.15s;text-align:center;}
.type-btn.t-active-vote{background:var(--green);color:#fff;}
.type-btn.t-active-fixed{background:var(--fixed-col);color:#fff;}

/* ── VOTER LIST ── */
.voter-list{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
.voter-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-xs);border:1px solid var(--border);background:var(--bg);cursor:pointer;transition:border-color 0.15s,background 0.15s;}
.voter-item.checked{border-color:rgba(58,107,74,0.35);background:var(--green-light);}
.voter-check{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;color:transparent;transition:background 0.15s,border-color 0.15s;}
.voter-item.checked .voter-check{background:var(--green);border-color:var(--green);color:#fff;}

/* ── CONFIRM ── */
.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(28,22,15,0.65);z-index:400;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(4px);}
.confirm-overlay.open{display:flex;}
.confirm-box{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:22px;max-width:320px;width:100%;box-shadow:var(--shadow);}
.confirm-title{font-family:var(--fh);font-size:18px;font-weight:700;font-style:italic;margin-bottom:8px;color:var(--ink);}
.confirm-msg{font-size:12px;color:var(--ink2);margin-bottom:18px;line-height:1.6;}
.confirm-btns{display:flex;gap:8px;}
.confirm-btns button{flex:1;min-height:44px;}

/* ── TOAST ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:30px;font-family:var(--fm);font-size:12px;opacity:0;transition:opacity 0.2s,transform 0.2s;z-index:999;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{background:var(--green);}
.toast.err{background:var(--red);}

/* ── MISC ── */
.loading-bar{position:fixed;top:0;left:0;height:2px;background:var(--gold);width:0%;transition:width 0.3s;z-index:999;}
.config-warn{background:var(--gold-light);border:1px solid rgba(196,154,16,0.3);border-radius:var(--radius-sm);padding:11px 14px;font-size:11px;color:var(--gold);line-height:1.5;}
.empty-slot{text-align:center;padding:20px 0;color:var(--ink3);font-size:12px;font-style:italic;}
.not-voter-note{font-size:11px;color:var(--ink3);padding:10px 18px 14px;font-style:italic;}

/* ── VOTE MODE SELECTOR ── */
.vote-mode-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px;}
.vote-mode-btn{padding:10px 6px;border-radius:var(--radius-sm);border:1.5px solid var(--border2);background:var(--bg);cursor:pointer;text-align:center;transition:border-color 0.15s,background 0.15s;}
.vote-mode-btn:active{background:var(--bg2);}
.vote-mode-btn.selected{border-color:var(--green);background:var(--green-light);}
.vote-mode-btn .vm-icon{font-size:18px;margin-bottom:4px;}
.vote-mode-btn .vm-label{font-size:10px;color:var(--ink2);line-height:1.4;font-family:var(--fm);}
.vote-mode-btn.selected .vm-label{color:var(--green);}
.mode-tag{font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid;margin-left:6px;vertical-align:middle;}
.mode-tag.ranking{border-color:rgba(196,154,16,0.4);color:var(--gold);background:var(--gold-light);}
.mode-tag.criteria{border-color:rgba(58,107,74,0.3);color:var(--green);background:var(--green-light);}
.mode-tag.both{border-color:rgba(184,74,47,0.3);color:var(--red);background:var(--red-light);}

/* ── RANKING STEP ── */
.rank-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:12px;}
.rank-section-label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.rank-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.rank-item:last-child{border-bottom:none;}
.rank-num-btns{display:flex;gap:4px;flex-shrink:0;}
.rank-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border2);background:var(--surface);font-family:var(--fh);font-size:12px;font-weight:700;color:var(--ink3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.1s;}
.rank-btn.active-rank{background:var(--gold);border-color:var(--gold);color:#000;}
.rank-btn:active{opacity:0.7;}
.rank-item-name{font-family:var(--fh);font-size:13px;font-weight:600;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rank-pos-badge{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:11px;font-weight:700;flex-shrink:0;}
.rank-pos-badge.p1{background:var(--gold);color:#000;}
.rank-pos-badge.p2{background:var(--bg3);color:var(--ink2);}
.rank-pos-badge.p3{background:var(--bg3);color:var(--ink2);}
.rank-pos-badge.unset{background:var(--border);color:var(--ink3);}

/* ── LEADERBOARD ── */
.leaderboard{margin:0 18px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;}
.lb-header{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.lb-title{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);}
.lb-live{font-size:10px;color:var(--green);display:flex;align-items:center;gap:4px;}
.lb-live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse-dot 1.5s ease infinite;}
@keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:0.3;}}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);}
.lb-row:last-child{border-bottom:none;}
.lb-pos{font-family:var(--fh);font-size:14px;font-weight:900;width:20px;flex-shrink:0;color:var(--ink3);}
.lb-pos.first{color:var(--gold);}
.lb-name{font-family:var(--fh);font-size:14px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb-bar-wrap{width:80px;flex-shrink:0;}
.lb-bar-bg{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.lb-bar-fill{height:100%;border-radius:3px;transition:width 0.5s cubic-bezier(.34,1.56,.64,1);}
.lb-bar-fill.top{background:var(--green);}
.lb-bar-fill.rest{background:var(--gold);}
.lb-score{font-size:11px;color:var(--ink3);width:32px;text-align:right;flex-shrink:0;}
.lb-crown{font-size:13px;flex-shrink:0;}
.lb-breakdown{font-size:10px;color:var(--ink3);padding:6px 14px 8px;display:flex;gap:12px;border-top:1px solid var(--border);flex-wrap:wrap;}
.lb-breakdown span{display:flex;align-items:center;gap:4px;}
.no-votes-yet{padding:14px;font-size:12px;color:var(--ink3);font-style:italic;text-align:center;}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.slot-card{animation:fadeUp 0.3s ease both;}
</style>
</head>
<body>

<div class="loading-bar" id="loading-bar"></div>
<div class="toast" id="toast"></div>

<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-title" id="confirm-title"></div>
    <div class="confirm-msg" id="confirm-msg"></div>
    <div class="confirm-btns">
      <button class="btn-outline" onclick="confirmResolve(false)">Cancel</button>
      <button class="btn-main red-btn" style="width:auto" onclick="confirmResolve(true)" id="confirm-ok-btn">Delete</button>
    </div>
  </div>
</div>

<!-- MODAL: TRIP -->
<div class="modal-overlay" id="modal-trip" onclick="overlayClick(event,'modal-trip')">
  <div class="modal-sheet"><div class="modal-pull"><div class="modal-pull-bar"></div></div>
  <div class="modal-body">
    <div class="modal-title" id="trip-modal-title">New trip</div>
    <div class="fg"><label>Trip name</label><input type="text" id="tf-name" placeholder="e.g. Ube Glamping Weekend"></div>
    <div class="fg-2">
      <div class="fg"><label>Start</label><input type="date" id="tf-start"></div>
      <div class="fg"><label>End</label><input type="date" id="tf-end"></div>
    </div>
    <div class="fg">
      <label>Members (one per line) <span class="ib" tabindex="0">?<span class="ib-tip">Everyone on the trip — they pick their name from a list, no accounts needed.</span></span></label>
      <textarea id="tf-members" placeholder="Phil&#10;Kenji&#10;Aoi&#10;Yuki"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-outline" onclick="closeModal('modal-trip')">Cancel</button>
      <button class="btn-main green-btn" onclick="saveTrip()">Save trip</button>
    </div>
  </div></div>
</div>

<!-- MODAL: SLOT -->
<div class="modal-overlay" id="modal-slot" onclick="overlayClick(event,'modal-slot')">
  <div class="modal-sheet"><div class="modal-pull"><div class="modal-pull-bar"></div></div>
  <div class="modal-body">
    <div class="modal-title" id="slot-modal-title">Add slot</div>
    <div class="fg"><label>Title</label><input type="text" id="sf-title" placeholder="e.g. Saturday Night Stay"></div>
    <div class="fg"><label>Date</label><input type="date" id="sf-date"></div>
    <div class="fg"><label>Slot type</label>
      <div class="type-toggle" style="margin-top:2px">
        <button class="type-btn t-active-vote" id="type-vote-btn" onclick="setSlotType('vote')">🗳 Vote</button>
        <button class="type-btn" id="type-fixed-btn" onclick="setSlotType('fixed')">✓ Already decided</button>
      </div>
    </div>
    <div id="vote-fields">
      <div class="fg">
        <label>Voting mode <span class="ib" tabindex="0">?<span class="ib-tip">Ranking = put options in order of preference. Criteria = score each option on factors like price and vibe. Both = rank first (70%), then score criteria (30%).</span></span></label>
        <div class="vote-mode-grid">
          <div class="vote-mode-btn" id="vm-ranking" onclick="setVoteMode('ranking')">
            <div class="vm-icon">🏆</div>
            <div class="vm-label">Ranking<br>only</div>
          </div>
          <div class="vote-mode-btn" id="vm-criteria" onclick="setVoteMode('criteria')">
            <div class="vm-icon">⭐</div>
            <div class="vm-label">Criteria<br>only</div>
          </div>
          <div class="vote-mode-btn" id="vm-both" onclick="setVoteMode('both')">
            <div class="vm-icon">🏆⭐</div>
            <div class="vm-label">Both<br>70 / 30</div>
          </div>
        </div>
        <div class="field-err" id="sf-mode-err"></div>
      </div>
      <div class="fg" id="criteria-field" style="display:none">
        <label>Criteria <span class="ib" tabindex="0">?<span class="ib-tip">Factors to score. Comma-separated. At least one required.</span></span></label>
        <input type="text" id="sf-criteria" value="price,location,vibe">
        <div class="form-hint">e.g. price, location, vibe, food, transport</div>
        <div class="field-err" id="sf-criteria-err"></div>
      </div>
      <div class="fg">
        <label>Who votes? <span class="ib" tabindex="0">?<span class="ib-tip">Only selected members need to vote. Leaderboard updates live as votes come in.</span></span></label>
        <div class="voter-list" id="voter-checklist"></div>
      </div>
    </div>
    <div id="fixed-fields" style="display:none">
      <div style="background:var(--fixed-light);border:1px solid rgba(90,107,58,0.25);border-radius:var(--radius-sm);padding:11px 13px;font-size:12px;color:var(--fixed-col);line-height:1.6;">
        Goes straight into the itinerary — no voting. You'll add the details next.
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-outline" onclick="closeModal('modal-slot')">Cancel</button>
      <button class="btn-main green-btn" id="slot-save-btn" onclick="saveSlot()">Save slot</button>
    </div>
  </div></div>
</div>

<!-- MODAL: OPTION -->
<div class="modal-overlay" id="modal-option" onclick="overlayClick(event,'modal-option')">
  <div class="modal-sheet"><div class="modal-pull"><div class="modal-pull-bar"></div></div>
  <div class="modal-body">
    <div class="modal-title" id="opt-modal-title">Add option</div>
    <div class="fg">
      <label>Paste URL to auto-fill <span class="ib" tabindex="0">?<span class="ib-tip">Works with Airbnb, Jalan, restaurant sites. Google Maps URLs go in the Maps field below.</span></span></label>
      <div class="fetch-row"><input type="url" id="of-url" placeholder="https://airbnb.com/..."><button class="btn-fetch" onclick="fetchPreview()">Fetch</button></div>
      <div class="fetch-status" id="fetch-status"></div>
    </div>
    <div class="fg"><label>Name</label><input type="text" id="of-title" placeholder="Forest Glamping Ube"><div class="field-err" id="of-title-err"></div></div>
    <div class="fg"><label>Photo URL</label><input type="url" id="of-img" placeholder="https://..."></div>
    <div class="fg"><label>Price</label><input type="text" id="of-price" placeholder="¥12,000/night"></div>
    <div class="fg">
      <label>Google Maps URL <span class="ib" tabindex="0">?<span class="ib-tip">Maps → Search place → Share → copy link. Shows as a Maps button.</span></span></label>
      <input type="url" id="of-maps" placeholder="https://maps.google.com/...">
    </div>
    <div class="fg"><label>Notes</label><textarea id="of-notes" placeholder="Outdoor bath, 30 min from station..."></textarea></div>
    <div class="modal-footer">
      <button class="btn-outline" onclick="closeModal('modal-option')">Cancel</button>
      <button class="btn-main green-btn" onclick="saveOption()">Save</button>
    </div>
  </div></div>
</div>

<!-- MODAL: IDENTITY -->
<div class="modal-overlay" id="modal-identity" onclick="overlayClick(event,'modal-identity')">
  <div class="modal-sheet"><div class="modal-pull"><div class="modal-pull-bar"></div></div>
  <div class="modal-body">
    <div class="modal-title">Switch identity</div>
    <p style="font-size:12px;color:var(--ink3);margin-bottom:16px;line-height:1.6">Tap your name. If it's missing, edit the trip to add it.</p>
    <div class="member-grid" id="switch-grid"></div>
    <button class="btn-outline danger" onclick="signOut()" style="width:100%;min-height:44px;font-size:12px;margin-top:14px">Sign out</button>
  </div></div>
</div>

<!-- TRIP SWITCHER DROPDOWN -->
<div class="switcher-overlay" id="switcher-overlay" onclick="closeSwitcher()"></div>
<div class="switcher-dropdown" id="switcher-dropdown" style="display:none">
  <div class="switcher-inner" id="switcher-inner"></div>
</div>

<!-- SHELL -->
<div class="header">
  <div class="header-inner">
    <div class="logo" style="cursor:pointer" onclick="goHome()">
      <span class="logo-word"><span class="logo-r">H</span>WM<span class="logo-g">B</span></span>
      <div class="logo-dot"></div>
    </div>
    <div style="display:flex;align-items:center;gap:4px">
      <button class="header-trip-btn" id="header-trip-btn" onclick="toggleSwitcher()" style="display:none">
        <span class="trip-name-txt" id="header-trip-txt">No trip</span>
        <span class="trip-caret">&#9662;</span>
      </button>
      <button class="back-btn" id="back-btn" onclick="goHome()" style="display:none">&#8592; All trips</button>
    </div>
  </div>
</div>
<div class="id-zone" id="id-zone"></div>
<div class="tabs" id="tabs" style="display:none">
  <button class="tab" id="tab-decisions" onclick="switchTab('decisions')">Decisions</button>
  <button class="tab" id="tab-itinerary" onclick="switchTab('itinerary')">Itinerary</button>
</div>

function avatarColor(name){
  if(!name)return AVATAR_PALETTE[0];
  const i=Math.abs([...name].reduce((a,c)=>a+c.charCodeAt(0),0))%AVATAR_PALETTE.length;
  return AVATAR_PALETTE[i];
}

// ── LOAD ALL TRIPS ──
async function load(){
  loading(true);
  if(DEMO){
    allTrips=DD.trips;
    // pre-load first trip data
    S.options={};S.votes={};
    for(const sl of DD.slots.dt1||[]){
      S.options[sl.id]=DD.options[sl.id]||[];
      S.votes[sl.id]=JSON.parse(JSON.stringify(DD.votes[sl.id]||[]));
    }
  } else {
    try{
      allTrips=await sbApi('trips?select=*&order=created_at.desc')||[];
      // If Supabase returns empty (e.g. blocked by CORS in preview), fall back to demo
      if(!allTrips.length){allTrips=DD.trips;S.options={};S.votes={};for(const sl of DD.slots.dt1||[]){S.options[sl.id]=DD.options[sl.id]||[];S.votes[sl.id]=JSON.parse(JSON.stringify(DD.votes[sl.id]||[]));}console.warn('HWMB: Using demo data (Supabase unreachable in this context)');}
    }catch{toast('Connection error — showing demo','err');allTrips=DD.trips;}
  }
  loading(false);
  currentScreen='home';
  renderAll();
}

// ── LOAD SINGLE TRIP ──
async function loadTrip(tripId){
  loading(true);
  if(DEMO){
    const trip=allTrips.find(t=>t.id===tripId);
    S.trip=trip||null;
    S.slots=DD.slots[tripId]||[];
    S.options={};S.votes={};
    for(const sl of S.slots){
      S.options[sl.id]=DD.options[sl.id]||[];
      S.votes[sl.id]=JSON.parse(JSON.stringify(DD.votes[sl.id]||[]));
    }
  } else {
    try{
      S.trip=allTrips.find(t=>t.id===tripId)||null;
      S.slots=await sbApi(`slots?trip_id=eq.${tripId}&select=*&order=slot_order,date`)||[];
      S.options={};S.votes={};
      for(const s of S.slots){
        S.options[s.id]=await sbApi(`options?slot_id=eq.${s.id}&select=*&order=option_order`)||[];
        S.votes[s.id]=await sbApi(`votes?slot_id=eq.${s.id}&select=*`)||[];
      }
    }catch{toast('Connection error','err');}
  }
  currentScreen='trip';
  currentTab='decisions';
  loading(false);
  renderAll();
}

function toggleSwitcher(){
  const dd=document.getElementById('switcher-dropdown');
  const ov=document.getElementById('switcher-overlay');
  const open=dd.style.display==='none';
  if(open){
    renderSwitcherContent();
    dd.style.display='block';ov.classList.add('open');
  } else {closeSwitcher();}
}
function closeSwitcher(){
  document.getElementById('switcher-dropdown').style.display='none';
  document.getElementById('switcher-overlay').classList.remove('open');
}
function renderSwitcherContent(){
  const today=new Date().toISOString().slice(0,10);
  const upcoming=allTrips.filter(t=>!t.end_date||t.end_date>=today);
  const past=allTrips.filter(t=>t.end_date&&t.end_date<today);
  let html='';
  if(upcoming.length){
    html+=`<div class="switcher-label">Upcoming</div>`;
    html+=upcoming.map(t=>switcherItem(t)).join('');
  }
  if(past.length){
    if(upcoming.length)html+=`<div class="switcher-divider"></div>`;
    html+=`<div class="switcher-label">Past</div>`;
    html+=past.map(t=>switcherItem(t)).join('');
  }
  html+=`<div class="switcher-divider"></div>
    <div class="switcher-new" onclick="closeSwitcher();openTripModal()">+ New trip</div>`;
  document.getElementById('switcher-inner').innerHTML=html;
}
function switcherItem(t){
  const today=new Date().toISOString().slice(0,10);
  const isUpcoming=!t.end_date||t.end_date>=today;
  const isCurrent=S.trip?.id===t.id;
  return `<div class="switcher-item${isCurrent?' active-trip':''}" onclick="closeSwitcher();loadTrip('${t.id}')">
    <div class="switcher-dot ${isUpcoming?'upcoming':'past'}"></div>
    <div style="flex:1;min-width:0">
      <div class="switcher-item-name">${t.title}</div>
      <div class="switcher-item-dates">${fmtRange(t.start_date,t.end_date)}</div>
    </div>
    ${isCurrent?'<span style="font-size:11px;color:var(--green)">&#10003;</span>':''}
  </div>`;
}

function renderHome(el){
  const today=new Date().toISOString().slice(0,10);
  const upcoming=allTrips.filter(t=>!t.end_date||t.end_date>=today);
  const past=allTrips.filter(t=>t.end_date&&t.end_date<today);

  function tripCard(t){
    const slots=DEMO?(DD.slots[t.id]||[]):(t.id===S.trip?.id?S.slots:[]);
    const openDecisions=slots.filter(s=>s.slot_type!=='fixed'&&s.status!=='decided').length;
    const decided=slots.filter(s=>s.status==='decided'||s.slot_type==='fixed').length;
    const members=t.member_names||[];
    const memberAvatars=members.slice(0,5).map((m,i)=>`<div class="trip-member-av ${avatarColor(m)}" style="z-index:${10-i};background:var(--${avatarColor(m)}-light);color:var(--${avatarColor(m)})">${m[0].toUpperCase()}</div>`).join('');
    const extraMembers=members.length>5?`<div class="trip-member-av" style="background:var(--bg3);color:var(--ink3);z-index:5">+${members.length-5}</div>`:'';
    const isPast=t.end_date&&t.end_date<today;
    return `<div class="trip-list-card${isPast?' past':''}" onclick="loadTrip('${t.id}')">
      <div class="trip-list-left">
        <div class="trip-list-name">${t.title}</div>
        <div class="trip-list-dates">${fmtRange(t.start_date,t.end_date)}</div>
        <div class="trip-list-meta">
          <div class="trip-member-stack">${memberAvatars}${extraMembers}</div>
          ${openDecisions>0?`<span class="trip-open-badge">${openDecisions} open</span>`:''}
          ${decided>0?`<span class="trip-decided-badge">${decided} decided</span>`:''}
        </div>
      </div>
      <div class="trip-list-arrow">›</div>
    </div>`;
  }

  let html=`${DEMO?`<div class="config-warn">Demo mode — replace SUPABASE_URL + SUPABASE_KEY to go live.</div>`:''}
  <div class="home-screen">`;

  if(!allTrips.length){
    html+=`<div class="empty-home">
      <div class="empty-home-icon">🌿</div>
      <div class="empty-home-title">No trips yet</div>
      <div class="empty-home-sub">Create your first trip and invite your crew.</div>
    </div>`;
  } else {
    if(upcoming.length){
      html+=`<div class="home-section-label">Upcoming</div>`;
      html+=upcoming.map(tripCard).join('');
    }
    if(past.length){
      html+=`<div class="home-section-label"${upcoming.length?' style="margin-top:24px"':''}>Past</div>`;
      html+=past.map(tripCard).join('');
    }
  }
  html+=`<button class="home-new-btn" onclick="openTripModal()">+ New trip</button></div>`;
  el.innerHTML=html;
}

function renderVoteSlot(slot,members){
  const opts=S.options[slot.id]||[];
  const votes=S.votes[slot.id]||[];
  const criteria=slot.criteria||[];
  const voteMode=slot.vote_mode||'criteria';
  const hasRanking=voteMode==='ranking'||voteMode==='both';
  const hasCriteria=voteMode==='criteria'||voteMode==='both';
  const voters=slot.voters&&slot.voters.length?slot.voters:members;
  const voted=[...new Set(votes.map(v=>v.voter_name))];
  const myVote=votes.find(v=>v.voter_name===me);
  const allVoted=voters.length>0&&voted.length>=voters.length;
  const iAmVoter=voters.includes(me);
  const isCreator=slot.created_by===me||S.trip?.created_by===me;
  const isSubset=slot.voters&&slot.voters.length>0&&slot.voters.length<members.length;

  let sc='deciding',sl='deciding';
  if(voted.length>0&&slot.status!=='decided'){sc='voted';sl=`${voted.length}/${voters.length} voted`;}
  if(allVoted&&slot.status!=='decided'){sc='voted';sl='all voted';}
  if(slot.status==='decided'){sc='decided';sl='decided';}

  // ── RANKING STEP (shown above option cards when mode includes ranking) ──
  let rankingStep='';
  if(hasRanking&&!myVote&&me&&iAmVoter&&slot.status!=='decided'&&opts.length>1){
    const myRanks=pendingRanks[slot.id]||{};
    rankingStep=`<div class="rank-section">
      <div class="rank-section-label">
        <span>Step 1 — Rank your preference</span>
        <span style="font-size:10px;color:var(--ink3)">${Object.keys(myRanks).length}/${opts.length} ranked</span>
      </div>
      ${opts.map(opt=>{
        const myRank=myRanks[opt.id];
        return `<div class="rank-item">
          <div class="rank-pos-badge ${myRank?'p'+myRank:'unset'}">${myRank||'·'}</div>
          <span class="rank-item-name">${opt.title}</span>
          <div class="rank-num-btns">
            ${opts.map((_,i)=>`<button class="rank-btn${myRank===i+1?' active-rank':''}"
              onclick="setRank('${slot.id}','${opt.id}',${i+1})"
              ontouchstart="event.preventDefault();setRank('${slot.id}','${opt.id}',${i+1})">${i+1}</button>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }

  // ── OPTION CARDS (criteria scoring inside if mode includes criteria) ──
  const optCards=opts.map(opt=>renderOptCard(opt,slot,myVote,criteria,allVoted,iAmVoter,hasRanking,hasCriteria)).join('');

  // ── LIVE LEADERBOARD ──
  let leaderboard='';
  if(opts.length&&votes.length>0&&slot.status!=='decided'){
    const lbData=computeLeaderboard(slot,opts,votes,voteMode);
    const maxScore=lbData[0]?.score||1;
    leaderboard=`<div class="leaderboard">
      <div class="lb-header">
        <span class="lb-title">Live standings</span>
        <span class="lb-live"><span class="lb-live-dot"></span>${voted.length}/${voters.length} voted</span>
      </div>
      ${lbData.length?lbData.map((r,i)=>`<div class="lb-row">
        <span class="lb-pos${i===0?' first':''}">${i===0?'👑':i+1}</span>
        <span class="lb-name">${r.opt.title}</span>
        <div class="lb-bar-wrap"><div class="lb-bar-bg"><div class="lb-bar-fill ${i===0?'top':'rest'}" style="width:${maxScore>0?Math.round(r.score/maxScore*100):0}%"></div></div></div>
        <span class="lb-score">${r.score.toFixed(0)}pt</span>
      </div>`).join(''):`<div class="no-votes-yet">No votes yet</div>`}
      ${voteMode==='both'?`<div class="lb-breakdown"><span>🏆 Ranking <strong>70%</strong></span><span>⭐ Criteria <strong>30%</strong></span></div>`:''}
    </div>`;
  } else if(opts.length&&slot.status!=='decided'&&!votes.length){
    leaderboard=`<div class="leaderboard"><div class="lb-header"><span class="lb-title">Live standings</span><span class="lb-live"><span class="lb-live-dot" style="background:var(--ink3)"></span>Waiting for first vote</span></div><div class="no-votes-yet">Leaderboard appears once someone votes</div></div>`;
  }

  // ── FINAL RESULTS (when decided) ──
  let finalResults='';
  if(slot.status==='decided'&&opts.length){
    const lbData=computeLeaderboard(slot,opts,votes,voteMode);
    const maxScore=lbData[0]?.score||1;
    finalResults=`<div class="leaderboard">
      <div class="lb-header"><span class="lb-title">Final results</span><span style="font-size:10px;color:var(--green)">Decided</span></div>
      ${lbData.map((r,i)=>`<div class="lb-row">
        <span class="lb-pos${i===0?' first':''}">${i===0?'👑':i+1}</span>
        <span class="lb-name">${r.opt.title}</span>
        <div class="lb-bar-wrap"><div class="lb-bar-bg"><div class="lb-bar-fill ${i===0?'top':'rest'}" style="width:${maxScore>0?Math.round(r.score/maxScore*100):0}%"></div></div></div>
        <span class="lb-score">${r.score.toFixed(0)}pt</span>
      </div>`).join('')}
    </div>`;
  }

  // ── FOOTER ACTIONS ──
  let footer='';
  if(slot.status==='decided'){
    const chosen=opts.find(o=>o.id===slot.chosen_option_id);
    footer=`<div class="confirm-banner"><div class="confirm-banner-name">✓ ${chosen?chosen.title:'Decided'}</div><div class="confirm-banner-sub">Locked · view in Itinerary</div></div>`;
    if(isCreator)footer+=`<button class="btn-outline" style="font-size:11px;min-height:36px;margin-top:2px" onclick="unlockSlot('${slot.id}')">Reopen</button>`;
  } else if(!me){
    footer=`<div class="vote-hint">Select your name above to vote.</div>`;
  } else if(!iAmVoter){
    footer=`<div class="vote-hint">${voters.map(cap).join(' & ')} decide this one.</div>`;

    footer=`<div class="voted-ok" style="cursor:pointer" onclick="showMyVote('${slot.id}')" title="Tap to see your vote">✓ Your vote is in &nbsp;·&nbsp; <span style="text-decoration:underline;opacity:0.8">see my vote</span></div>`;

      const top=computeLeaderboard(slot,opts,votes,voteMode)[0];
      footer+=`<button class="btn-main green-btn" style="margin-top:8px" onclick="confirmDecision('${slot.id}','${top?.opt.id}')">Confirm: ${top?.opt.title||'winner'}</button>`;
    }
  } else if(opts.length){
    const rankOk=!hasRanking||opts.length<=1||Object.keys(pendingRanks[slot.id]||{}).length===opts.length;

    footer=`<div class="vote-hint">Add options to begin.</div>`;

  return `<div class="slot-card" id="slot-${slot.id}">
    <div class="slot-head" onclick="toggleSlot('${slot.id}')">
      <div class="slot-color-bar ${sc}"></div>
      <div class="slot-main">

        <div class="slot-title">${slot.title}</div>

      </div>
      <div class="slot-right">${editDel}<span class="badge ${sc}">${sl}</span><span class="chevron" id="chev-${slot.id}">▾</span></div>
    </div>
    <div class="slot-body" id="body-${slot.id}">
      ${rankingStep}
      <div class="options-wrap">${optCards||`<div class="empty-slot">No options yet.</div>`}</div>
      <div style="padding:0 18px 8px"><button class="btn-outline" onclick="openOptModal('${slot.id}')">+ Add option</button></div>
      <div class="slot-foot">${footer}</div>

    return;
  }
  const byDate={};

  const dates=Object.keys(byDate).sort((a,b)=>a>b?1:-1);
  let html='<div class="timeline">';

    html+=`<div class="day-group">

function shareItinerary(){
  const all=S.slots.filter(s=>s.status==='decided'||s.slot_type==='fixed');
  const sorted=[...all].sort((a,b)=>(a.date||'')>(b.date||'')?1:-1);
  let text=`🌿 ${S.trip?.title||'Our Weekend'}\n\n`;
  let lastDate='';
  for(const slot of sorted){
    const opt=(S.options[slot.id]||[]).find(o=>o.id===slot.chosen_option_id)||(S.options[slot.id]||[])[0];
    if(!opt)continue;
    const d=slot.date?fmtDate(slot.date):'TBD';
    if(d!==lastDate){text+=`📅 ${d}\n`;lastDate=d;}
    text+=`  ${slot.title}: ${opt.title}`;
    if(opt.price_label)text+=` (${opt.price_label})`;
    text+='\n';
    if(opt.maps_url)text+=`  📍 ${opt.maps_url}\n`;
  }
  if(navigator.share)navigator.share({title:S.trip?.title,text}).catch(()=>{});
  else navigator.clipboard.writeText(text).then(()=>toast('Copied to clipboard!','ok')).catch(()=>toast('Copy failed','err'));
}

  const data={title,start_date:document.getElementById('tf-start').value||null,end_date:document.getElementById('tf-end').value||null,member_names:members,created_by:editingSlotId?S.trip?.created_by:me||members[0]||'unknown'};
  loading(true);
  if(editingSlotId){
    if(DEMO){Object.assign(S.trip,data);const i=allTrips.findIndex(t=>t.id===S.trip.id);if(i>-1)allTrips[i]={...allTrips[i],...data};}
    else{const r=await sbApi(`trips?id=eq.${S.trip.id}`,{method:'PATCH',body:JSON.stringify(data)});if(r&&r[0]){S.trip=r[0];const i=allTrips.findIndex(t=>t.id===S.trip.id);if(i>-1)allTrips[i]=S.trip;}}
    toast('Trip updated','ok');
  } else {

    else{const r=await sbApi('trips',{method:'POST',body:JSON.stringify(data)});if(r&&r[0]){allTrips.unshift(r[0]);S.trip=r[0];S.slots=[];S.options={};S.votes={};currentScreen='trip';}}

  closeModal('modal-trip');editingSlotId=null;loading(false);renderAll();

async function saveSlot(){
  const title=document.getElementById('sf-title').value.trim();
  if(!title)return toast('Add a title','err');
  const isFixed=currentSlotType==='fixed';
  let criteria=[],voters=[],voteMode='criteria';
  if(!isFixed){
    if(!currentVoteMode){document.getElementById('sf-mode-err').textContent='Choose a voting mode above';return;}
    voteMode=currentVoteMode;
    const hasCrit=voteMode==='criteria'||voteMode==='both';
    if(hasCrit){
      criteria=document.getElementById('sf-criteria').value.split(',').map(s=>s.trim()).filter(Boolean);
      if(!criteria.length){document.getElementById('sf-criteria-err').textContent='At least one criterion required';return;}
      document.getElementById('sf-criteria-err').textContent='';
    }
    voters=getSelectedVoters();
  }
  const existing=editingSlotId?S.slots.find(s=>s.id===editingSlotId):null;
  const data={trip_id:S.trip.id,title,date:document.getElementById('sf-date').value||null,criteria,voters,vote_mode:voteMode,slot_type:isFixed?'fixed':'vote',slot_order:existing?existing.slot_order:S.slots.length,status:isFixed?'decided':existing?.status||'deciding',chosen_option_id:existing?.chosen_option_id||null,created_by:existing?.created_by||me};
  loading(true);
  let slotId=editingSlotId;
  if(editingSlotId){
    if(DEMO){const i=S.slots.findIndex(s=>s.id===editingSlotId);if(i>-1)S.slots[i]={...S.slots[i],...data};}
    else{await sbApi(`slots?id=eq.${editingSlotId}`,{method:'PATCH',body:JSON.stringify(data)});S.slots=await sbApi(`slots?trip_id=eq.${S.trip.id}&select=*&order=slot_order,date`)||[];}
    toast('Slot updated','ok');
  } else {
    if(DEMO){const s={id:'s'+Date.now(),...data};S.slots.push(s);S.options[s.id]=[];S.votes[s.id]=[];slotId=s.id;}
    else{const r=await sbApi('slots',{method:'POST',body:JSON.stringify(data)});if(r&&r[0]){S.slots.push(r[0]);S.options[r[0].id]=[];S.votes[r[0].id]=[];slotId=r[0].id;}}
    toast(isFixed?'Fixed plan added!':'Slot added!','ok');
  }
  closeModal('modal-slot');editingSlotId=null;loading(false);
  if(isFixed&&slotId&&!existing?.chosen_option_id)setTimeout(()=>openOptModal(slotId),300);
  renderAll();
}

async function saveOption(){
  const title=document.getElementById('of-title').value.trim();
  document.getElementById('of-title-err').textContent='';
  if(!title){document.getElementById('of-title-err').textContent='Name is required';return;}

  loading(true);
  let newOptId=editingOptId;
  if(editingOptId){
    if(DEMO){const i=(S.options[activeSlotId]||[]).findIndex(o=>o.id===editingOptId);if(i>-1)S.options[activeSlotId][i]={...S.options[activeSlotId][i],...data};}
    else{await sbApi(`options?id=eq.${editingOptId}`,{method:'PATCH',body:JSON.stringify(data)});S.options[activeSlotId]=await sbApi(`options?slot_id=eq.${activeSlotId}&select=*&order=option_order`)||[];}

async function deleteSlot(slotId){
  const ok=await confirm2('Delete this slot?','All options and votes removed. Cannot be undone.');
  if(!ok)return;
  if(DEMO){S.slots=S.slots.filter(s=>s.id!==slotId);delete S.options[slotId];delete S.votes[slotId];}
  else{await sbApi(`slots?id=eq.${slotId}`,{method:'DELETE'});S.slots=S.slots.filter(s=>s.id!==slotId);delete S.options[slotId];delete S.votes[slotId];}
  toast('Deleted','ok');renderAll();
}

async function deleteOpt(slotId,optId){
  const ok=await confirm2('Delete this option?','Cannot be undone.');
  if(!ok)return;
  if(DEMO){S.options[slotId]=(S.options[slotId]||[]).filter(o=>o.id!==optId);}
  else{await sbApi(`options?id=eq.${optId}`,{method:'DELETE'});S.options[slotId]=(S.options[slotId]||[]).filter(o=>o.id!==optId);}
  toast('Deleted','ok');renderAll();
}

async function confirmDecision(slotId,optId){
  const opt=(S.options[slotId]||[]).find(o=>o.id===optId);

  if(DEMO){const s=S.slots.find(sl=>sl.id===slotId);if(s){s.status='decided';s.chosen_option_id=optId;}}

}

async function submitVote(slotId){
  if(!me)return toast('Select your name first','err');
  const slot=S.slots.find(s=>s.id===slotId);
  const opts=S.options[slotId]||[],criteria=slot?.criteria||[];
  const voteMode=slot?.vote_mode||'criteria';
  const hasRanking=voteMode==='ranking'||voteMode==='both';
  const hasCriteria=voteMode==='criteria'||voteMode==='both';
  const sc={};
  for(const opt of opts){
    sc[opt.id]={};
    if(hasRanking){const r=pendingRanks[slotId]?.[opt.id]||(opts.length===1?1:null);if(r)sc[opt.id].rank=r;}
    if(hasCriteria){for(const c of criteria)sc[opt.id][c]=scores[`${slotId}-${opt.id}-${c}`]||3;}
  }
  const vd={slot_id:slotId,voter_name:me,scores:sc};
  loading(true);
  if(DEMO){S.votes[slotId]=(S.votes[slotId]||[]).filter(v=>v.voter_name!==me);S.votes[slotId].push({id:'v'+Date.now(),...vd});}
  else{await sbApi('votes',{method:'POST',body:JSON.stringify(vd),headers:{Prefer:'return=representation,resolution=merge-duplicates'}});S.votes[slotId]=await sbApi(`votes?slot_id=eq.${slotId}&select=*`)||[];}
  scores={};touchedOpts={};delete pendingRanks[slotId];openSlots.add(slotId);loading(false);renderAll();toast('Vote in!','ok');
}

// ── STARS ──
function setStar(optId,c,val,slotId){scores[`${slotId}-${optId}-${c}`]=val;touchedOpts[`${slotId}-${optId}`]=true;refreshStars(optId,c,val);checkVoteBtn(slotId);}
function touchStar(e,optId,c,val,slotId){e.preventDefault();setStar(optId,c,val,slotId);}
function refreshStars(optId,c,val){document.querySelectorAll(`.star[data-opt="${optId}"][data-c="${c}"]`).forEach(s=>s.classList.toggle('lit',parseInt(s.dataset.v)<=val));}
function hoverStar(optId,c,val){document.querySelectorAll(`.star[data-opt="${optId}"][data-c="${c}"]`).forEach(s=>s.style.color=parseInt(s.dataset.v)<=val?'var(--gold)':'var(--bg3)');}
function unhoverStar(optId,c,slotId){const cur=scores[`${slotId}-${optId}-${c}`]||0;document.querySelectorAll(`.star[data-opt="${optId}"][data-c="${c}"]`).forEach(s=>s.style.color=parseInt(s.dataset.v)<=cur?'var(--gold)':'var(--bg3)');}
function checkVoteBtn(slotId){
  const slot=S.slots.find(s=>s.id===slotId);
  const voteMode=slot?.vote_mode||'criteria';
  const hasRanking=voteMode==='ranking'||voteMode==='both';
  const hasCriteria=voteMode==='criteria'||voteMode==='both';
  const opts=S.options[slotId]||[];
  const rankOk=!hasRanking||opts.length<=1||Object.keys(pendingRanks[slotId]||{}).length===opts.length;
  const critOk=!hasCriteria||opts.every(o=>touchedOpts[`${slotId}-${o.id}`]);
  const btn=document.getElementById(`vote-btn-${slotId}`);
  if(btn)btn.disabled=!(rankOk&&critOk);
}

// ── RANKING ──
function setRank(slotId,optId,rank){
  if(!pendingRanks[slotId])pendingRanks[slotId]={};
  // clear any other option that had this rank
  for(const [oid,r] of Object.entries(pendingRanks[slotId])){if(r===rank&&oid!==optId)delete pendingRanks[slotId][oid];}
  pendingRanks[slotId][optId]=rank;
  checkVoteBtn(slotId);
  // re-render just the ranking step to show updated state
  const slot=S.slots.find(s=>s.id===slotId);
  const members=S.trip?.member_names||[];
  const votes=S.votes[slotId]||[];
  const myVote=votes.find(v=>v.voter_name===me);
  const opts=S.options[slotId]||[];
  if(!myVote&&me&&opts.length){
    const myRanks=pendingRanks[slotId]||{};
    const rankSection=document.querySelector(`#slot-${slotId} .rank-section`);
    if(rankSection){
      // update pos badges and active rank buttons
      opts.forEach(opt=>{
        const badge=rankSection.querySelector(`.rank-item:has([onclick*="${opt.id}"]) .rank-pos-badge`);
        const r=myRanks[opt.id];
        if(badge){badge.className=`rank-pos-badge ${r?'p'+r:'unset'}`;badge.textContent=r||'·';}
        rankSection.querySelectorAll(`.rank-btn`).forEach(btn=>{
          const onc=btn.getAttribute('onclick')||'';
          if(onc.includes(`'${opt.id}'`)){
            const n=parseInt(btn.textContent);
            btn.classList.toggle('active-rank',myRanks[opt.id]===n);
          }
        });
      });
      const countEl=rankSection.querySelector('.rank-section-label span:last-child');
      if(countEl)countEl.textContent=`${Object.keys(myRanks).length}/${opts.length} ranked`;
    }
  }
}

// ── COMPUTE LEADERBOARD (Borda count for ranking, avg for criteria, 70/30 combined) ──
function computeLeaderboard(slot,opts,votes,voteMode){
  const hasRanking=voteMode==='ranking'||voteMode==='both';
  const hasCriteria=voteMode==='criteria'||voteMode==='both';
  const criteria=slot.criteria||[];
  const n=opts.length;
  return opts.map(opt=>{
    let rankScore=0,critScore=0;
    let rankVoters=0,critVoters=0;
    for(const v of votes){
      const s=v.scores?.[opt.id];
      if(!s)continue;
      if(hasRanking&&s.rank){
        // Borda: 1st=n pts, 2nd=n-1 pts, etc.
        rankScore+=(n-s.rank+1);
        rankVoters++;
      }
      if(hasCriteria&&criteria.length){
        let sum=0,cnt=0;
        for(const c of criteria){if(s[c]){sum+=Number(s[c]);cnt++;}}
        if(cnt){critScore+=sum/cnt;critVoters++;}
      }
    }
    const avgRank=rankVoters?rankScore/rankVoters:0;
    const avgCrit=critVoters?critScore/critVoters:0;
    // Normalise rank to 0-5 scale (max Borda = n, min = 1)
    const normRank=n>1?avgRank/(n)*5:avgRank;
    let combined=0;
    if(voteMode==='both')combined=normRank*0.7+avgCrit*0.3;
    else if(voteMode==='ranking')combined=normRank;
    else combined=avgCrit;
    return{opt,score:combined*20}; // scale to 0-100 points for readability
  }).sort((a,b)=>b.score-a.score);
}

// ── MY VOTE VIEWER ──
function showMyVote(slotId){
  const slot=S.slots.find(s=>s.id===slotId);
  const votes=S.votes[slotId]||[];
  const myVote=votes.find(v=>v.voter_name===me);
  const opts=S.options[slotId]||[];
  const voteMode=slot?.vote_mode||'criteria';
  const hasRanking=voteMode==='ranking'||voteMode==='both';
  const hasCriteria=voteMode==='criteria'||voteMode==='both';
  const criteria=slot?.criteria||[];
  if(!myVote){toast('No vote found','err');return;}

  // build ranked list
  let html='';
  if(hasRanking){
    const ranked=opts.map(opt=>({opt,rank:myVote.scores?.[opt.id]?.rank||99})).sort((a,b)=>a.rank-b.rank);
    html+=`<div style="margin-bottom:16px">
      <div style="font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px">My ranking</div>
      ${ranked.map((r,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="width:24px;height:24px;border-radius:50%;background:${i===0?'var(--gold)':'var(--bg3)'};color:${i===0?'#000':'var(--ink2)'};display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:11px;font-weight:700;flex-shrink:0">${r.rank<99?r.rank:'—'}</div>
        <span style="font-family:var(--fh);font-size:14px;font-weight:600">${r.opt.title}</span>
      </div>`).join('')}
    </div>`;
  }
  if(hasCriteria&&criteria.length){
    html+=`<div>
      <div style="font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px">My criteria scores</div>
      ${opts.map(opt=>`<div style="margin-bottom:12px">
        <div style="font-family:var(--fh);font-size:13px;font-weight:700;margin-bottom:5px">${opt.title}</div>
        ${criteria.map(c=>{
          const val=myVote.scores?.[opt.id]?.[c]||0;
          return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <span style="font-size:11px;color:var(--ink3);width:64px;text-transform:capitalize">${c}</span>
            <span style="color:var(--gold);font-size:14px;letter-spacing:1px">${'★'.repeat(val)}${'☆'.repeat(5-val)}</span>
            <span style="font-size:11px;color:var(--ink3)">${val}/5</span>
          </div>`;
        }).join('')}
      </div>`).join('')}
    </div>`;
  }

  // inject into modal
  const existing=document.getElementById('myvote-content');
  if(existing){existing.innerHTML=html;openModal('modal-myvote');return;}

  // create modal on the fly if not in DOM
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';overlay.id='modal-myvote';
  overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};
  overlay.innerHTML=`<div class="modal-sheet"><div class="modal-pull"><div class="modal-pull-bar"></div></div>
    <div class="modal-body">
      <div class="modal-title">My vote</div>
      ${html}
      <div class="modal-footer" style="margin-top:12px">
        <button class="btn-main green-btn" onclick="document.getElementById('modal-myvote').remove()">Close</button>
      </div>
    </div></div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>overlay.classList.add('open'));
}

// ── IDENTITY ──
function setMe(name){me=name.toLowerCase();localStorage.setItem('hwmb_me',me);closeModal('modal-identity');renderAll();toast(`Signed in as ${cap(name)}`,'ok');}
function signOut(){me='';localStorage.removeItem('hwmb_me');closeModal('modal-identity');renderAll();toast('Signed out');}

// ── MODAL OPENERS ──
function openTripModal(editing=false){
  editingSlotId=editing?'edit':null;
  document.getElementById('trip-modal-title').textContent=editing?'Edit trip':'New trip';
  if(editing&&S.trip){document.getElementById('tf-name').value=S.trip.title||'';document.getElementById('tf-start').value=S.trip.start_date||'';document.getElementById('tf-end').value=S.trip.end_date||'';document.getElementById('tf-members').value=(S.trip.member_names||[]).map(cap).join('\n');}
  else['tf-name','tf-start','tf-end','tf-members'].forEach(id=>document.getElementById(id).value='');
  openModal('modal-trip');
}

function openSlotModal(slotId=null){
  editingSlotId=slotId;
  document.getElementById('slot-modal-title').textContent=slotId?'Edit slot':'Add slot';
  document.getElementById('sf-criteria-err').textContent='';
  document.getElementById('sf-mode-err').textContent='';
  const existing=slotId?S.slots.find(s=>s.id===slotId):null;
  const type=existing?.slot_type||'vote';
  currentSlotType=type;
  currentVoteMode=existing?.vote_mode||null;
  document.getElementById('sf-title').value=existing?.title||'';
  document.getElementById('sf-date').value=existing?.date||'';
  document.getElementById('sf-criteria').value=(existing?.criteria||['price','location','vibe']).join(',');
  setSlotType(type);
  // restore vote mode selection
  ['ranking','criteria','both'].forEach(m=>{
    const el=document.getElementById('vm-'+m);
    if(el)el.classList.toggle('selected',m===currentVoteMode);
  });
  const cf=document.getElementById('criteria-field');
  if(cf)cf.style.display=(currentVoteMode==='criteria'||currentVoteMode==='both')?'block':'none';
  document.getElementById('voter-checklist').innerHTML=buildVoterChecklist(existing?.voters||[]);
  openModal('modal-slot');
}

function openOptModal(slotId,optId=null){
  activeSlotId=slotId;editingOptId=optId;
  const slot=S.slots.find(s=>s.id===slotId);
  document.getElementById('opt-modal-title').textContent=optId?'Edit details':slot?.slot_type==='fixed'?'Add plan details':'Add option';
  document.getElementById('of-title-err').textContent='';document.getElementById('fetch-status').textContent='';
  if(optId){const o=(S.options[slotId]||[]).find(op=>op.id===optId);if(o){document.getElementById('of-url').value=o.url||'';document.getElementById('of-title').value=o.title||'';document.getElementById('of-img').value=o.image_url||'';document.getElementById('of-price').value=o.price_label||'';document.getElementById('of-maps').value=o.maps_url||'';document.getElementById('of-notes').value=o.notes||'';}}
  else clearOptForm();
  openModal('modal-option');
}

function clearOptForm(){['of-url','of-title','of-img','of-price','of-maps','of-notes'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});document.getElementById('fetch-status').textContent='';}

async function fetchPreview(){
  const url=document.getElementById('of-url').value.trim();
  if(!url)return toast('Paste a URL first','err');
  const st=document.getElementById('fetch-status');
  if(/maps\.google|goo\.gl\/maps|maps\.app\.goo/i.test(url)){document.getElementById('of-maps').value=url;st.textContent='Maps URL moved to Maps field below ↓';return;}
  st.textContent='Fetching...';
  try{const r=await fetch(`https://api.microlink.io/?url=${encodeURIComponent(url)}`);const d=await r.json();
    if(d.data){if(d.data.title&&!document.getElementById('of-title').value)document.getElementById('of-title').value=d.data.title;if(d.data.image?.url&&!document.getElementById('of-img').value)document.getElementById('of-img').value=d.data.image.url;st.textContent='Done — review and edit below';}
    else st.textContent='No preview found — fill in manually';
  }catch{st.textContent='Fetch failed — fill in manually';}
}

// ── UI UTILS ──
function toggleSlot(id){
  const body=document.getElementById('body-'+id),chev=document.getElementById('chev-'+id);
  if(!body||!chev)return;
  const open=body.classList.toggle('open');
  chev.classList.toggle('open',open);
  if(open)openSlots.add(id);else openSlots.delete(id);
}
function openModal(id){document.getElementById(id)?.classList.add('open');}
function closeModal(id){document.getElementById(id)?.classList.remove('open');}
function overlayClick(e,id){if(e.target===e.currentTarget)closeModal(id);}
function confirm2(title,msg,okLabel='Delete'){
  return new Promise(resolve=>{
    document.getElementById('confirm-title').textContent=title;
    document.getElementById('confirm-msg').textContent=msg;
    document.getElementById('confirm-ok-btn').textContent=okLabel;
    confirmCb=resolve;document.getElementById('confirm-overlay').classList.add('open');
  });
}
function confirmResolve(val){document.getElementById('confirm-overlay').classList.remove('open');if(confirmCb){confirmCb(val);confirmCb=null;}}
function toast(msg,type=''){const el=document.getElementById('toast');el.textContent=msg;el.className='toast'+(type?' '+type:'');el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>{el.classList.remove('show');el.className='toast';},2600);}
function loading(on){const bar=document.getElementById('loading-bar');bar.style.width=on?'70%':'100%';if(!on)setTimeout(()=>{bar.style.width='0%';bar.style.transition='none';setTimeout(()=>bar.style.transition='width 0.3s',50);},300);}
function cap(s){return s?s[0].toUpperCase()+s.slice(1):s;}
function fmtDate(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}catch{return d;}}
function fmtDayLabel(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-US',{weekday:'long'});}catch{return d;}}
function fmtRange(s,e){if(!s&&!e)return'Dates TBD';const f=d=>{try{return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});}catch{return d;}};return s&&e?`${f(s)} – ${f(e)}`:f(s||e);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){['modal-trip','modal-slot','modal-option','modal-identity'].forEach(closeModal);document.getElementById('confirm-overlay').classList.remove('open');if(confirmCb){confirmCb(false);confirmCb=null;}}});
load();
